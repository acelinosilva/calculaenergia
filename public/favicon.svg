<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Emerald into Vivid Mint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Bolt Gradient: Pure White into Crisp Cyan-Mint -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Subtle Drop Shadow on the Bolt -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <!-- Ambient Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Soft Outer Rim -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="17"
    fill="url(#bgGrad)"
  />

  <!-- Inner Rim for Tactile Depth on Dark/Light Browser Tabs -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.25"
  />

  <!-- Subtle Bottom Bevel Rim -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="none"
    stroke="#022c22"
    stroke-width="1"
    stroke-opacity="0.3"
  />

  <!-- Precision Energy Bolt (Perfect Optical Centering & Balanced Weight) -->
  <path
    d="M 37.5 8
       L 17 32
       L 31 32
       L 25 56
       L 47 28
       L 33 28
       Z"
    fill="url(#boltGrad)"
    filter="url(#boltShadow)"
  />

  <!-- Dynamic Precision Spark Point (Energy / Meter Reading Spark) -->
  <circle
    cx="46"
    cy="14"
    r="3.5"
    fill="url(#sparkGrad)"
  />
  <circle
    cx="46"
    cy="14"
    r="1.8"
    fill="#ffffff"
  />
</svg>
