<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="appleBolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="180" height="180" rx="42" fill="url(#appleBg)" />
  <rect x="3" y="3" width="174" height="174" rx="39" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Centered Lightning Bolt -->
  <path
    d="M 106 24
       L 48 91
       L 88 91
       L 72 156
       L 132 80
       L 93 80
       Z"
    fill="url(#appleBolt)"
    filter="url(#appleShadow)"
  />

  <!-- High-Precision Energy Accent Spark -->
  <circle cx="130" cy="40" r="10" fill="#fde047" opacity="0.9" />
  <circle cx="130" cy="40" r="5" fill="#ffffff" />
</svg>
