<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glowing circles -->
  <circle cx="1050" cy="150" r="350" fill="#059669" opacity="0.15" filter="blur(60px)" />
  <circle cx="150" cy="550" r="280" fill="#047857" opacity="0.12" filter="blur(60px)" />

  <!-- Container Box -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2" />

  <!-- Icon Badge -->
  <g transform="translate(140, 130)">
    <rect width="72" height="72" rx="20" fill="url(#brand)" />
    <!-- Lightning Bolt -->
    <path d="M40 14L22 38h14l-4 20 22-26H38z" fill="#ffffff" />
  </g>

  <!-- Brand Title -->
  <text x="235" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">
    Calcula<tspan fill="#34d399">Energia</tspan>
  </text>
  <text x="235" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">
    calculaenergia.vercel.app • Homologado ANEEL 2026
  </text>

  <!-- Main Headline -->
  <text x="140" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Calculadora de Conta de Energia
  </text>
  <text x="140" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#34d399">
    Simule, confira e aprenda a ler seu medidor
  </text>

  <!-- Subheadline features -->
  <text x="140" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    ✓ Tarifas de todas as concessionárias do Brasil (TUSD + TE)
  </text>
  <text x="140" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    ✓ Verificador de fatura: detecte cobranças indevidas e leituras estimadas
  </text>
  <text x="140" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    ✓ Simulador interativo de relógio analógico de ponteiros e digital LCD
  </text>

  <!-- Watermark badge right bottom -->
  <g transform="translate(850, 440)">
    <rect width="210" height="52" rx="14" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" />
    <text x="105" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">
      100% Gratuito
    </text>
  </g>
</svg>
